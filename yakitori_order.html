<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>焼き鳥 発注表</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
      background: #1a1a1a;
      color: #f0e6d3;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f5c842;
      margin-bottom: 16px;
    }

    .nav-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .nav-bar label {
      font-size: 0.85rem;
      color: #aaa;
    }

    .nav-bar input[type="date"] {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #2a2a2a;
      color: #f0e6d3;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }

    .nav-bar input[type="date"]:focus {
      border-color: #f5c842;
    }

    .nav-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #2a2a2a;
      color: #f0e6d3;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s;
    }

    .nav-btn:hover { background: #3a3a3a; }

    .info-bar {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 14px;
    }

    .info-bar span { color: #f5c842; }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    table {
      border-collapse: collapse;
      background: #222;
    }

    thead tr { background: #2e2e2e; }

    thead th {
      padding: 9px 10px;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: #f5c842;
      border-bottom: 2px solid #444;
      white-space: nowrap;
    }

    thead th:first-child { text-align: left; }

    tbody tr {
      border-bottom: 1px solid #2e2e2e;
      transition: background 0.1s;
    }

    tbody tr:hover { background: #272727; }
    tbody tr:last-child { border-bottom: none; }

    td {
      padding: 7px 8px;
      text-align: center;
      vertical-align: middle;
    }

    td.name {
      text-align: left;
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      padding-right: 14px;
    }

    td.target { color: #888; font-size: 0.85rem; }

    td.delivery-cell { color: #7ec8e3; font-size: 0.9rem; font-weight: 600; }

    td input[type="number"] {
      width: 52px;
      padding: 4px 4px;
      border-radius: 5px;
      border: 1px solid #444;
      background: #1a1a1a;
      color: #f0e6d3;
      text-align: center;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
    }

    td input[type="number"]::-webkit-outer-spin-button,
    td input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

    td input[type="number"]:focus {
      border-color: #f5c842;
      background: #252525;
    }

    td.forecast-cell input {
      border-color: #5a8a5a;
      color: #7dcf7d;
    }

    td.order-cell input {
      border-color: #f5c842;
      color: #f5c842;
      font-weight: 700;
      background: #1e1a00;
      width: 58px;
    }

    td.order-cell input:focus { background: #252000; }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 9px 20px;
      border-radius: 7px;
      border: none;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary { background: #f5c842; color: #1a1a1a; }
    .btn-primary:hover { background: #ffd966; }

    .btn-secondary { background: #2a2a2a; color: #ccc; border: 1px solid #555; }
    .btn-secondary:hover { background: #333; }

    .footer-note {
      margin-top: 14px;
      font-size: 0.76rem;
      color: #555;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<h1>🍢 焼き鳥 発注表</h1>

<div class="nav-bar">
  <button class="nav-btn" onclick="moveDay(-1)">◀ 前日</button>
  <div>
    <label>日付</label>
    <input type="date" id="datePicker" onchange="onDateChange()">
  </div>
  <button class="nav-btn" onclick="moveDay(1)">翌日 ▶</button>
</div>

<div class="info-bar">
  納品欄は <span id="deliveryFromLabel">—</span> の発注数を自動表示（中1日・変更不可）
</div>

<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>名称</th>
        <th>1日目安</th>
        <th>納品</th>
        <th>残数</th>
        <th>予測数</th>
        <th>発注数</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="buttons">
  <button class="btn btn-primary" onclick="calcAll()">発注数を自動計算</button>
  <button class="btn btn-secondary" onclick="clearDay()">この日をリセット</button>
</div>

<div class="footer-note">
  ※ 予測数：1日目安がデフォルト（手動で変更可）<br>
  ※ 発注数の計算：max( 0, 予測数 − 残数 − 納品 )<br>
  ※ 発注数は最終的に手動で調整してください
</div>

<script>
  const items = [
    { name: 'ねぎま',   icon: '🍢', target: 30 },
    { name: 'むね',     icon: '🍗', target: 10 },
    { name: 'ぼんじり', icon: '🍢', target: 30 },
    { name: 'せせり',   icon: '🍢', target: 15 },
    { name: 'ハツ',     icon: '❤️', target: 30 },
    { name: 'レバー',   icon: '🫀', target: 10 },
    { name: 'とり皮',   icon: '🍢', target: 15 },
    { name: '砂肝',    icon: '🍢', target: 15 },
    { name: 'ささみ',   icon: '🍢', target: 30 },
  ];

  // dateKey: "YYYY-MM-DD"
  // stored per date: { remaining: [], forecast: [], order: [] }  (arrays indexed by item)

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function addDays(dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + n);
    return d.toISOString().slice(0, 10);
  }

  function formatLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const wd = ['日','月','火','水','木','金','土'][d.getDay()];
    return `${d.getMonth()+1}/${d.getDate()}（${wd}）`;
  }

  function storageKey(dateStr) { return `yakitori_${dateStr}`; }

  function loadDate(dateStr) {
    const raw = localStorage.getItem(storageKey(dateStr));
    return raw ? JSON.parse(raw) : null;
  }

  function saveDate(dateStr, data) {
    localStorage.setItem(storageKey(dateStr), JSON.stringify(data));
  }

  function getCurrentData() {
    const date = document.getElementById('datePicker').value;
    const remaining = items.map((_, i) => parseInt(document.getElementById(`remaining_${i}`)?.value) || 0);
    const forecast  = items.map((_, i) => parseInt(document.getElementById(`forecast_${i}`)?.value)  || 0);
    const order     = items.map((_, i) => parseInt(document.getElementById(`order_${i}`)?.value)     || 0);
    return { remaining, forecast, order };
  }

  function saveCurrent() {
    const date = document.getElementById('datePicker').value;
    if (!date) return;
    saveDate(date, getCurrentData());
  }

  let currentDate = todayStr();

  function onDateChange() {
    currentDate = document.getElementById('datePicker').value;
    renderTable();
  }

  function moveDay(n) {
    saveCurrent();
    currentDate = addDays(currentDate, n);
    document.getElementById('datePicker').value = currentDate;
    renderTable();
  }

  // 納品 = 発注数 from 2 days ago (中1日)
  function getDelivery(dateStr) {
    const fromDate = addDays(dateStr, -2);
    const data = loadDate(fromDate);
    return { values: data ? data.order : items.map(() => 0), fromDate };
  }

  function renderTable() {
    saveCurrent();  // save before switching (if fields exist)

    const date = currentDate;
    const data = loadDate(date);
    const { values: delivery, fromDate } = getDelivery(date);

    // update info bar
    document.getElementById('deliveryFromLabel').textContent = formatLabel(fromDate) + ' の発注数';

    const body = document.getElementById('tableBody');
    body.innerHTML = '';

    items.forEach((item, idx) => {
      const remaining = data?.remaining[idx] ?? '';
      // forecast default = target if not set
      const forecast  = data ? data.forecast[idx] : item.target;
      const order     = data?.order[idx] ?? '';
      const del       = delivery[idx] || 0;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="name">${item.icon} ${item.name}</td>
        <td class="target">${item.target}</td>
        <td class="delivery-cell">${del > 0 ? del : '—'}</td>
        <td><input type="number" id="remaining_${idx}" min="0" value="${remaining}" placeholder="0" oninput="saveCurrent()"></td>
        <td class="forecast-cell"><input type="number" id="forecast_${idx}" min="0" value="${forecast}" oninput="saveCurrent()"></td>
        <td class="order-cell"><input type="number" id="order_${idx}" min="0" value="${order}" placeholder="—" oninput="saveCurrent()"></td>
      `;
      body.appendChild(tr);
    });
  }

  function calcAll() {
    items.forEach((item, idx) => {
      const date = currentDate;
      const { values: delivery } = getDelivery(date);
      const remaining = parseInt(document.getElementById(`remaining_${idx}`).value) || 0;
      const forecast  = parseInt(document.getElementById(`forecast_${idx}`).value)  || item.target;
      const del       = delivery[idx] || 0;
      const order = Math.max(0, forecast - remaining - del);
      document.getElementById(`order_${idx}`).value = order;
    });
    saveCurrent();
  }

  function clearDay() {
    if (!confirm(`${formatLabel(currentDate)} のデータをリセットしますか？`)) return;
    localStorage.removeItem(storageKey(currentDate));
    renderTable();
  }

  // Init
  document.getElementById('datePicker').value = currentDate;
  renderTable();

  window.addEventListener('beforeunload', saveCurrent);
</script>
</body>
</html>
